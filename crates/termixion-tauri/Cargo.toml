# termixion-tauri — thin Tauri shell (authority §6).
# A-1 skeleton: a minimal binary that depends only on the workspace crates, so `cargo metadata`
# resolves offline. B-3 turns this into a real Tauri 2 app (adds `tauri` + `tauri-build`,
# a build.rs calling tauri_build::build(), commands/channels, window/menu) and wires it to the
# `app/` frontend via tauri.conf.json.
[package]
name = "termixion-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "termixion"
path = "src/main.rs"

[dependencies]
termixion-core = { path = "../termixion-core" }
termixion-platform = { path = "../termixion-platform" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-opener = "2.5.4"
tauri-plugin-clipboard-manager = "2.3.2"
# trmx-236: the logging sink — stdout + ~/Library/Logs/<bundle id>/termixion.log (2 MiB, one archive).
tauri-plugin-log = "2.9.0"
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# trmx-80 (FR-13): comment-preserving edits of ~/.config/termixion/termixion.toml + watching it.
toml_edit = "0.25.12"
# trmx-206: embed the vendored zsh plugin trees (resources/shell-enhancements) in the binary.
include_dir = "0.7"
notify = "8.2.0"

[dev-dependencies]
# trmx-239 (M12): TEST-only — logging.rs's probe test skips its assertion when running as root.
# The shell's non-test uid/mode work goes through termixion-platform behind the R1 seam.
libc = "0.2"
# trmx-224: parse the authored Info.plist in the NSServices shape test (lockfile-aligned 1.x).
plist = "1"
# trmx-300: TEST-only — the command census parses real signatures instead of grepping source text.
# Two string-matching versions both leaked (a fully-qualified `crate::ipc_error::IpcError`, a
# `CommandOutcome<T, IpcError>`, a `pub mod`), which is what a syntax-keyed heuristic does.
# Already in the lockfile via proc-macros, so this adds no new supply-chain surface.
# trmx-252: `visit` is added for the command census in tests/command_capabilities.rs — the
# registration list sits deep inside a builder-chain expression, so the walk has to be a real AST
# traversal. Declared EXPLICITLY rather than relied upon through feature unification: another
# crate in the graph may enable it today and stop tomorrow, and the failure would be a compile
# error in a security gate. Same crate, no new supply-chain surface.
syn = { version = "3", features = ["full", "parsing", "visit"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
