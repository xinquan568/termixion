# trmx-302: an ON-DEMAND Playwright flake harvester.
#
# WHY THIS EXISTS. #251's gate measured ~2.2% failures across 46 runs of the Playwright suite at
# `--retries: 0`, but the failing run's output was lost twice and 26 full-capture runs never
# reproduced it. `retries: 1` masks it in normal CI (two consecutive failures at 2.2% is ~0.05%),
# and locally it is a lottery at ~2.5 min per run. This turns "wait for luck" into a decision about
# how many runs to pay for.
#
# HOW MANY RUNS BUY WHAT. With a per-run failure rate p, the chance of seeing at least one failure
# in N runs is 1-(1-p)^N. At the measured p ~= 2.2%:
#
#     N =  30  ->  ~49%      N = 100  ->  ~89%
#     N =  60  ->  ~74%      N = 150  ->  ~96%
#
# The default (10 shards x 6 runs = 60) is a ~74% shot in roughly 7 minutes of wall clock. Raise it
# if a dispatch comes back clean — a clean harvest is weak evidence, not an all-clear. The same
# arithmetic is why #302's "fresh 20/20 gate" criterion cannot validate a fix on its own: 20 clean
# runs happen ~64% of the time even with the flake fully present.
#
# NOT A GATE. `workflow_dispatch` only — it never runs on push or pull_request, costs nothing until
# someone asks for it, and must never become a required check.
#
# TEMPORARY. Delete this file when #302 closes; it is a diagnostic, not part of the build.
name: flake harvest (trmx-302)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards (each on its own runner)"
        required: false
        default: "10"
      runs_per_shard:
        description: "Suite runs per shard; total runs = shards x this"
        required: false
        default: "6"
      runner:
        description: "Runner image. macos-14 is where the flake was observed; ubuntu-latest is ~10x cheaper but a different environment."
        required: false
        default: "macos-14"
        type: choice
        options:
          - macos-14
          - ubuntu-latest

concurrency:
  group: flake-harvest-${{ github.ref }}
  # Never cancel a harvest in flight — a killed shard loses the evidence it was collecting.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The shard list is built dynamically so `shards` can be an input rather than a hardcoded matrix.
  plan:
    name: plan shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.build.outputs.shards }}
    steps:
      - id: build
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          case "$SHARDS" in ''|*[!0-9]*) echo "shards must be a positive integer, got '$SHARDS'" >&2; exit 1 ;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 50 ]; then
            echo "shards must be between 1 and 50, got $SHARDS" >&2; exit 1
          fi
          echo "shards=$(seq 1 "$SHARDS" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  harvest:
    name: harvest ${{ matrix.shard }}
    needs: plan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      # Every shard runs to completion: one shard finding the flake must not cancel the others,
      # because the count of clean runs is what turns a single sighting into a rate.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium (no-op when cached)
        run: pnpm --filter app exec playwright install chromium

      # No Rust or Tauri build: this suite runs against the vite dev server, which Playwright starts
      # itself. That is what makes a harvest minutes rather than the full gate's ~7 per run.
      - name: Run the suite repeatedly, stopping at the first failure
        id: loop
        env:
          RUNS: ${{ inputs.runs_per_shard }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -uo pipefail
          case "$RUNS" in ''|*[!0-9]*) echo "runs_per_shard must be a positive integer, got '$RUNS'" >&2; exit 1 ;; esac
          mkdir -p flake-logs
          for i in $(seq 1 "$RUNS"); do
            echo "::group::shard $SHARD run $i/$RUNS"
            # --retries=0 so a flake is a visible failure, and --trace on the CLI so the committed
            # playwright.config.ts is untouched — the trace-mode change belongs to #302 itself and
            # is gated behind the diagnosis this workflow exists to produce.
            if CI=1 pnpm --filter app exec playwright test --retries=0 --trace=retain-on-failure \
                 > "flake-logs/shard-$SHARD-run-$i.log" 2>&1; then
              echo "run $i: PASS"
              rm -f "flake-logs/shard-$SHARD-run-$i.log"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "shard $SHARD: FAILED on run $i of $RUNS"
              echo "caught=true" >> "$GITHUB_OUTPUT"
              echo "run_index=$i" >> "$GITHUB_OUTPUT"
              # The whole log is kept, not a grepped summary: the two lost sightings behind #302
              # were both lost by capturing only a tail.
              echo "### shard $SHARD caught a failure on run $i/$RUNS" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -E "✘|Error:|expect|failed" "flake-logs/shard-$SHARD-run-$i.log" | head -25 >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "shard $SHARD: $RUNS/$RUNS clean"
          echo "### shard $SHARD: $RUNS/$RUNS clean" >> "$GITHUB_STEP_SUMMARY"

      # !cancelled(), not failure(): a shard that ends green still has nothing to upload thanks to
      # if-no-files-found, while a shard that failed uploads both the trace and the full log. This
      # is the same reasoning that made #303 catch a retry-absorbed flake a failure() step would
      # have discarded.
      - name: Upload the failing run's trace and log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-shard-${{ matrix.shard }}
          path: |
            app/test-results
            flake-logs
          if-no-files-found: ignore
