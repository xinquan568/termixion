# CI (E-1): the full gate. The `core-linux` job proves the platform-agnostic core builds + tests
# headless (R1) and `seam-guard` runs the required seam scan — both on cheap ubuntu runners; the macOS
# job runs the complete gate (fmt/clippy/lint, full workspace tests, frontend tests, the packaged-app
# `--smoke`, the Playwright webview test, and an advisory footprint). The product is macOS-only since
# v0.1.1 (trmx-187) — the Linux full gate (trmx-102) was dropped with the Linux release line.
# Mirrors the §2.2 guardrails so a `--no-verify` local bypass still fails here. See plan §8.
#
# Supply chain (trmx-234): every third-party action is pinned to a full commit SHA (the `# vX.Y.Z`
# comment is what Dependabot bumps alongside the SHA); the token is read-only; every job has a timeout;
# `secret-scan` runs the R5 scan over the PR / push diff; `deps-audit` gates on cargo-deny + pnpm audit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing in this workflow writes to the repository. `checks: read` is inert here today
# and pre-provisions the release gate's CI-green check (trmx-242).
permissions:
  contents: read
  checks: read

jobs:
  # REQUIRED seam gate (F5/F10) — platform-independent, so one standalone job (mark it required in
  # branch protection). Needs the toolchain for the cargo-tree forbidden-dependency scan.
  seam-guard:
    name: core seam guard (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: core seam guard (forbidden-dep + no platform cfg / std::os)
        run: bash scripts/check-core-seam.sh
      # trmx-240: hosted in the REQUIRED job on purpose. In the advisory shell-integration job it
      # would only report a violation, and the docs would then be claiming enforcement that does not
      # exist — the ungated-claim failure trmx-239 closed.
      - name: no committed zsh wordcode (trmx-240)
        run: bash scripts/check-no-zwc.sh
      # trmx-254: same reasoning as trmx-240 above. This gate enforces that the app/ orchestration
      # modules own no React state, refs or effects and import only downward — the invariant the
      # App.tsx decomposition rests on and the one the type checker cannot see. It was briefly in the
      # ADVISORY shell-integration job, which would have made the PR claim enforcement that did not
      # exist. The self-test runs beside it: a gate nobody has watched FAIL is a gate that may be
      # checking nothing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.2.0
      - name: Install deps (typescript is a devDependency the gate parses with)
        run: pnpm install --frozen-lockfile
      - name: app/ orchestration contract gate (trmx-254)
        run: node scripts/verify-contracts.mjs
      - name: app/ contract gate self-test (trmx-254)
        run: bash scripts/verify-contracts.test.sh
      # trmx-254: generated prop types once carried absolute `import("/Users/...")` references. They
      # typechecked on the machine that produced them and failed on every other. Local tsc cannot
      # catch that — the paths exist locally — so it needs its own gate.
      - name: no absolute module specifiers (trmx-254)
        run: bash scripts/check-no-abs-paths.sh
      - name: absolute-path gate self-test (trmx-254)
        run: bash scripts/check-no-abs-paths.test.sh

  # R5 (trmx-234): the same secret scan the pre-commit hook runs, over the PR diff (or the pushed range)
  # so a `--no-verify` bypass or a hook-less clone still fails here. Full history so the base ref resolves —
  # the scan exits 2 (never a vacuous pass) when the range cannot be resolved.
  secret-scan:
    name: secret scan (R5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: secret-scan over the PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: bash scripts/secret-scan.sh --range "origin/$BASE...HEAD"
      - name: secret-scan over the pushed range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "secret-scan: branch creation — no prior commit to diff against."; exit 0
          fi
          bash scripts/secret-scan.sh --range "$BEFORE..HEAD"
      # trmx-235: the callable command set is part of the control protocol — a change without a bump fails here.
      - name: control-protocol gate over the PR diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: bash scripts/check-control-protocol.sh --range "origin/$BASE...HEAD"
      - name: control-protocol gate over the pushed range
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "check-control-protocol: branch creation — nothing to diff against."; exit 0
          fi
          bash scripts/check-control-protocol.sh --range "$BEFORE..HEAD"

  # trmx-99 (FR-7b): the shell-integration snippets must be shellcheck-clean and pass the source-and-assert
  # test (idempotency, hook preservation, $?-capture). ubuntu runners ship shellcheck; zsh is installed for
  # the zsh half of the test. trmx-234 adds the secret-scan self-test and the repo-stats unit tests here;
  # trmx-261 the issue-link gate's self-test (the gate itself runs from base in its own workflow, so this
  # is the only place its logic is exercised on a PR).
  shell-integration:
    name: shell integration (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh (for the zsh half of the source-and-assert test)
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: shellcheck the bash snippet, the test, and the secret-scan / control-protocol / issue-link scripts
        run: shellcheck -s bash resources/shell-integration/termixion.bash resources/shell-integration/integration_test.sh scripts/secret-scan.sh scripts/secret-scan.test.sh scripts/check-control-protocol.sh scripts/check-control-protocol.test.sh scripts/check-issue-link.sh scripts/check-issue-link.test.sh scripts/check-core-seam.sh scripts/check-core-seam.test.sh .claude/hooks/hooks.test.sh .claude/hooks/pre-commit .claude/hooks/pre-push scripts/check-no-zwc.sh scripts/check-no-zwc.test.sh scripts/check-release-app-resolution.test.sh scripts/resolve-release-app.sh scripts/check-main-ci-green.sh scripts/check-main-ci-green.test.sh scripts/check-file-budgets.sh scripts/check-file-budgets.test.sh scripts/verify-contracts.test.sh scripts/check-no-abs-paths.sh scripts/check-no-abs-paths.test.sh
      - name: source-and-assert (idempotency, hook preservation, $?-capture)
        run: bash resources/shell-integration/integration_test.sh
      - name: secret-scan self-test (range mode detects a planted token; bad range fails loudly)
        run: bash scripts/secret-scan.test.sh
      - name: control-protocol gate self-test (trmx-235)
        run: bash scripts/check-control-protocol.test.sh
      - name: issue-link gate self-test (R9 + the dependabot[bot] allowance, trmx-261)
        run: bash scripts/check-issue-link.test.sh
      - name: core-seam shell-dependency gate self-test (R1, trmx-239)
        run: bash scripts/check-core-seam.test.sh
      - name: git-hook self-test (the hooks run what the docs claim, trmx-239)
        run: bash .claude/hooks/hooks.test.sh
      - name: no-zwc gate self-test (trmx-240)
        run: bash scripts/check-no-zwc.test.sh
      - name: release-bundle resolution self-test (trmx-242)
        run: bash scripts/check-release-app-resolution.test.sh
      - name: main-CI-green release gate self-test (trmx-242)
        run: bash scripts/check-main-ci-green.test.sh
      - name: repo-stats unit tests (trmx-213)
        run: python3 scripts/repo-stats.test.py
      - name: file line-budget ratchet (trmx-243)
        run: bash scripts/check-file-budgets.sh
      - name: file line-budget gate self-test (trmx-243)
        run: bash scripts/check-file-budgets.test.sh

  # trmx-234: dependency audit — cargo-deny (advisories / bans / licenses / sources per deny.toml) and
  # pnpm audit (prod, high+). cargo-deny is provisioned from crates.io at a pinned version (no extra
  # third-party action); rust-cache keeps the built binary warm.
  deps-audit:
    name: dependency audit (cargo deny + pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny 0.20.2 (skipped when the cached binary already matches)
        run: cargo deny --version 2>/dev/null | grep -q ' 0\.20\.2$' || cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check (deny.toml)
        run: cargo deny check
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.6.0
      # No `cache: pnpm` here: audit reads the lockfile only (no install), so there is no store to cache and
      # setup-node's post-job cache step would fail the job on the missing path.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: pnpm audit (prod, high and above)
        run: pnpm audit --prod --audit-level=high

  # REQUIRED — the platform-agnostic core must build + test headless on Linux (no platform deps).
  core-linux:
    name: core tests (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo test (termixion-core)
        run: cargo test -p termixion-core --locked

  # The full macOS gate (Apple-silicon, Q1): every §2.2 guardrail plus the packaged-app end-to-end
  # `--smoke` (the authoritative E2E — Tauri has no macOS WebDriver, Risk R-3) and the Playwright webview
  # test. Cheap checks run before the heavy build so failures surface fast.
  macos:
    name: full gate (macos)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      # trmx-234: keep the tauri-cli binary across Cargo.lock bumps (rust-cache keys on the lockfile) and
      # skip the multi-minute source build when the cached binary already reports the pinned version.
      - name: Cache cargo-tauri 2.11.3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.11.3-${{ runner.os }}-${{ runner.arch }}
      - name: Bootstrap cargo-tauri (§2.4; no-op when cached)
        run: cargo tauri --version 2>/dev/null | grep -q ' 2\.11\.3$' || cargo install tauri-cli --version 2.11.3 --locked

      # --- fast gates first ---
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: pnpm lint
        run: pnpm --filter app lint
      - name: cargo test (workspace — incl. macOS PTY + integration)
        run: cargo test --workspace --locked
      # trmx-253 (M20): the vitest step REPLACED by its coverage-enabled form, not run beside it —
      # two runs of the same suite would double the job's slowest step for no extra signal.
      # Thresholds are negative (maximum uncovered counts), so this fails on NEW uncovered code
      # rather than on a percentage that drifts as files are added.
      - name: pnpm test (vitest, with coverage)
        run: pnpm --filter app exec vitest run --coverage
      # `!cancelled()`, NOT `success()`: a threshold failure is exactly when someone needs to read
      # the report. Uploading only on success is the trap trmx-303 already fixed for Playwright
      # traces. The report is written under app/coverage (the vitest root is app/), not repo-root.
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: app/coverage
          if-no-files-found: warn
          retention-days: 14
      # ADVISORY, and advisory includes FAILING TO INSTALL — a step that can fail the build is not
      # advisory, so install and run share one continue-on-error step.
      #
      # The binary IS cached, and it needs its own step: Swatinem/rust-cache covers the target dir
      # and the registry, NOT ~/.cargo/bin. An earlier version of this comment claimed the binary
      # was "cached separately" while nothing cached it and `cargo install` ran on every job — the
      # comment asserted something the workflow did not do (review finding 2).
      #
      # It re-runs the whole workspace suite instrumented, so if it crowds the job's 60-minute
      # budget it moves to its own job rather than being trimmed.
      - name: Cache cargo-llvm-cov binary (advisory)
        id: llvmcov-cache
        continue-on-error: true
        # SHA-pinned like every other action here (trmx-234 supply-chain hardening).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-llvm-cov
          key: cargo-llvm-cov-0.6.20-${{ runner.os }}-${{ runner.arch }}
      - name: cargo llvm-cov (advisory — never fails the build)
        continue-on-error: true
        run: |
          if ! cargo llvm-cov --version 2>/dev/null | grep -q '0\.6\.20'; then
            cargo install cargo-llvm-cov --version 0.6.20 --locked
          fi
          cargo llvm-cov --workspace --locked --summary-only

      # --- build + end-to-end ---
      # trmx-207: the sidecar ships only in BUNDLED builds (tauri.sidecar.conf.json overlay);
      # plain cargo build/clippy/test stay sidecar-free. Fetch is pinned + sha256-verified.
      - name: Fetch Starship sidecar (trmx-207)
        run: bash scripts/fetch-starship.sh aarch64-apple-darwin
      - name: Build the packaged app (debug)
        run: cargo tauri build --debug --config tauri.sidecar.conf.json
        working-directory: crates/termixion-tauri
      - name: Packaged app --smoke (authoritative E2E)
        run: bash scripts/smoke.sh
      # trmx-251: the smoke runs BEFORE Playwright, so a smoke failure would otherwise fire the
      # trace upload below, find nothing, ignore it, and discard the actual reason. `if: failure()`
      # because the ordinary next step is SKIPPED once a previous step fails.
      # The log lives under $HOME, and `upload-artifact`'s `path` is a glob, not a shell — so it is
      # copied into the workspace by a step that DOES expand $HOME rather than relying on `~`.
      - name: Collect packaged-smoke log
        if: failure()
        run: |
          mkdir -p smoke-logs
          cp "$HOME/Library/Logs/dev.termixion.terminal/termixion.log" smoke-logs/ || true
      - name: Upload packaged-smoke log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-log
          path: smoke-logs
          if-no-files-found: ignore
      # trmx-234: the browser download is keyed on the lockfile-resolved @playwright/test version (the
      # manifest range could stay unchanged while the resolved package moves).
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium (no-op when cached)
        run: pnpm --filter app exec playwright install chromium
      - name: Playwright webview component test (dev server)
        run: pnpm --filter app test:e2e
      # trmx-251: CI had no artifact at all, so a Playwright failure was diagnosed from scrollback.
      #
      # `!cancelled()`, NOT `failure()`. Under the current `retries: 1` a flake that fails its first
      # attempt and passes the retry leaves the JOB GREEN — `failure()` would skip the upload and
      # discard the very trace that identifies it. `trace: "on-first-retry"` produces a trace for
      # exactly that case, and #302's ~2.2% flake is exactly that case. So the trace is kept whether
      # or not the job ends red. A fully clean run stores NOTHING: the only file Playwright leaves
      # is the dot-prefixed `.last-run.json`, and `upload-artifact` excludes hidden files by default.
      #
      # `if-no-files-found: ignore` because this also runs when something EARLIER in the job failed
      # and Playwright never ran; without it the upload would fail and mask the real error.
      # Output is app/test-results (see .gitignore:11), not test-results.
      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: app/test-results
          if-no-files-found: ignore

      # --- advisory only (not a gate): NFR-2 footprint smoke ---
      - name: Footprint (advisory)
        run: du -sh target/debug/bundle/macos/Termixion.app | awk '{ print "termixion.app (debug) size:", $1 }'
