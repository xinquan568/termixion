# Release (E-2): on a pushed `v*` tag, build the Apple-silicon app on macos-14, then publish ONE (draft)
# GitHub Release with the macOS installer + updater artifacts + latest.json. macOS-only since v0.1.1
# (trmx-187) — the Linux release line (trmx-102, FR-1.7) shipped v0.0.9–v0.1.0 and was dropped; see
# docs/RELEASE.md.
#
# SIGNING IS DUAL-MODE (trmx-49), decided by the "Signing mode" gate from the Apple secrets alone:
#   - ALL six APPLE_* secrets → signed + notarized + stapled macOS build (independently verified).
#   - NONE                    → DELIBERATE unsigned personal-alpha macOS build (0.0.x).
#   - a PARTIAL set           → fail fast — a half-configured release is never shipped.
# TAURI_SIGNING_PRIVATE_KEY is ALWAYS required so the auto-updater can verify every update artifact
# (the minisign key signs the macOS .app.tar.gz).
#
# Two jobs (build UPLOADS artifacts; `publish` NEEDS it, downloads them, assembles latest.json, and
# creates the release exactly once). trmx-234: actions are SHA-pinned (`# vX.Y.Z` is what Dependabot
# bumps); the tag name reaches `run:` steps only through `env:` (never interpolated into shell text).
name: release

on:
  push:
    tags: ["v*"]
  # trmx-242: a DRY-RUN trigger. It takes no version input and CANNOT publish: the `publish` job
  # below carries `if: github.event_name == 'push'`, so a manual run exercises ci-green +
  # build-macos (including the release smoke) and stops. Artifact UPLOADS stay ungated on purpose —
  # a dry run must keep its own evidence. Removing that `if` would create a manual publish path.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# trmx-242: read-only by DEFAULT; `contents: write` is granted to the `publish` job alone rather
# than to every job in the workflow (trmx-234 narrowed this token deliberately — this narrows it
# further rather than widening it for the new gate).
permissions:
  contents: read

jobs:
  # trmx-242 (grill H8): releases were triggered by a tag with nothing between the tag and the
  # build. "Wait for post-merge main CI green before tagging" was a human convention; this is the
  # gate. Eleven releases in sixty-six days were published without CI ever having executed them.
  ci-green:
    name: require green main CI for this commit (required before building)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read # list workflow runs for this SHA
      contents: read # git ancestry check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ancestry check needs history
      - name: Require a green push-to-main ci.yml run for this commit
        # The gate logic lives in a SCRIPT with a self-test (scripts/check-main-ci-green.test.sh,
        # run by ci.yml) rather than inline here. Inline YAML cannot be unit-tested: a dry run on a
        # branch only ever reaches the no-matching-run path, so newest-run precedence and the
        # non-success conclusions — the parts that make this gate correct rather than merely
        # present — would never be exercised until the day they had to be right.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          R: ${{ github.repository }}
        run: bash scripts/check-main-ci-green.sh

  build-macos:
    name: build macos (signs + notarizes when configured)
    needs: [ci-green]
    runs-on: macos-14
    timeout-minutes: 90
    outputs:
      signed: ${{ steps.mode.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Decide the signing mode BEFORE building (fail fast on a bad config). trmx-49: unsigned is a
      # DELIBERATE state (zero Apple secrets). TAURI_SIGNING_PRIVATE_KEY is required in BOTH modes.
      - name: Signing mode (all six Apple secrets = signed; none = unsigned alpha; partial = fail)
        id: mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing — every release must ship a verifiable (signed) updater artifact. See docs/RELEASE.md (Auto-update)."
            exit 1
          fi
          missing=(); n_present=0
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v:-}" ]; then n_present=$((n_present + 1)); else missing+=("$v"); fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "All six Apple signing secrets present — SIGNED + notarized release."
          elif [ "$n_present" -eq 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple signing secrets — deliberate UNSIGNED personal-alpha build (trmx-49)."
          else
            echo "::error::Partial Apple signing config — missing: ${missing[*]}. Set ALL six or NONE."
            exit 1
          fi

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install "$(sed -nE 's/^channel = "([^"]+)".*/\1/p' rust-toolchain.toml)"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.6.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      # trmx-234: keep the tauri-cli binary across Cargo.lock bumps and skip the source build when the cached
      # binary already reports the pinned version (same cache key as ci.yml).
      - name: Cache cargo-tauri 2.11.3
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.11.3-${{ runner.os }}-${{ runner.arch }}
      - name: Bootstrap cargo-tauri (§2.4; no-op when cached)
        run: cargo tauri --version 2>/dev/null | grep -q ' 2\.11\.3$' || cargo install tauri-cli --version 2.11.3 --locked

      - name: Release metadata + tag gate
        env:
          # trmx-242: only a TAG PUSH carries a tag to check. On workflow_dispatch `github.ref_name`
          # is the branch ("main"), and check-release-metadata.sh would compare it against
          # "v<workspace_version>" and fail — the dry-run trigger would abort before ever reaching
          # the build it exists to exercise. Empty means "no tag to verify", which that script
          # already treats as skip; the version-alignment checks still run.
          EXPECTED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bash scripts/check-release-metadata.sh

      # trmx-207: the Starship sidecar (tauri.conf externalBin) — pinned + sha256-verified;
      # bundling FAILS without it, so this precedes both tauri-action modes.
      - name: Fetch Starship sidecar (trmx-207)
        run: bash scripts/fetch-starship.sh aarch64-apple-darwin

      # --bundles app,dmg overrides tauri.conf's local-only ["app"]; the app target is EXPLICIT so the
      # updater artifacts (.app.tar.gz+.sig) are produced. Two mode-gated copies: the unsigned build must
      # NOT export APPLE_* at all (the bundler keys off variable presence).
      - name: Build, sign + notarize (tauri-action — signed mode)
        if: steps.mode.outputs.signed == 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/termixion-tauri
          args: --bundles app,dmg --config tauri.updater.conf.json --config tauri.sidecar.conf.json

      - name: Build (tauri-action — unsigned personal-alpha mode, trmx-49)
        if: steps.mode.outputs.signed == 'false'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/termixion-tauri
          args: --bundles app,dmg --config tauri.updater.conf.json --config tauri.sidecar.conf.json

      # trmx-242 (grill H8): EXECUTE the release bundle, do not merely assert it exists. `--smoke`
      # previously ran only against `cargo tauri build --debug`, while what ships is the release
      # profile (panic="abort", lto="thin", strip=true) — a materially different artifact that no
      # gate had ever launched.
      - name: Smoke the RELEASE bundle (launches the app + drives a real PTY)
        # Resolution lives in scripts/resolve-release-app.sh, exercised by
        # scripts/check-release-app-resolution.test.sh in ci.yml. It prints exactly one verified
        # release .app path or fails: `smoke.sh` defaults to the DEBUG bundle via `${1:-…}`, and
        # `${1:-…}` substitutes on an EMPTY argument as well as a missing one, so an unmatched
        # `find` piped straight in would silently smoke a cached debug build and let this gate pass
        # while testing the wrong artifact.
        run: |
          set -euo pipefail
          app="$(bash scripts/resolve-release-app.sh)"
          echo "smoking release bundle: $app"
          bash scripts/smoke.sh "$app" 2>&1 | tee smoke-release.log

      # Uploaded even on failure — a gate whose diagnostics vanish when it trips is one people
      # learn to re-run instead of read. `panic="abort"` + `strip=true` means a release-build
      # failure has no backtrace, so this log is the only evidence there is.
      - name: Upload the release smoke log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-release-log
          path: smoke-release.log
          if-no-files-found: warn

      # Signed: prove notarized + stapled BEFORE publishing. Unsigned: assert existence + log the ad-hoc sig.
      - name: Verify artifact (stapler + Gatekeeper when signed; existence when unsigned)
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          set -euo pipefail
          dmg=$(find target -name 'Termixion_*_aarch64.dmg' -print -quit)
          if [ -z "$dmg" ]; then echo "::error::no .dmg was produced under target/"; exit 1; fi
          echo "verifying: $dmg"
          if [ "$SIGNED" = "true" ]; then
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature -vvv "$dmg"
          else
            echo "::notice::UNSIGNED personal-alpha build — skipping stapler/spctl. Gatekeeper will block until approved by hand."
            codesign -dvv "$dmg" 2>&1 || true
          fi

      # Stage exactly the files publish needs into one dir, then upload as an artifact (no publish here).
      - name: Stage + upload macOS artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-macos
          cp "$(find target -name 'Termixion_*_aarch64.dmg' -print -quit)" dist-macos/
          cp "$(find target -name '*.app.tar.gz' -print -quit)" dist-macos/
          cp "$(find target -name '*.app.tar.gz.sig' -print -quit)" dist-macos/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: dist-macos/
          if-no-files-found: error

  publish:
    name: publish draft release (macOS + latest.json)
    needs: [build-macos]
    # trmx-242: the ONLY job that creates a GitHub Release, and the only one gated on the tag
    # trigger. A `workflow_dispatch` dry run therefore cannot publish by construction rather than
    # by discipline. Removing this line would turn the manual trigger into a publish path.
    if: github.event_name == 'push'
    permissions:
      contents: write # create the Release + upload the installers
      actions: read # download the build artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-macos
          path: dist-macos

      # Assemble latest.json (darwin-aarch64 — macOS-only since v0.1.1, trmx-187).
      # Verify the signature is present + non-empty before publishing.
      - name: Assemble updater manifest (latest.json — darwin-aarch64)
        id: updater
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mac_art=$(find dist-macos -name '*.app.tar.gz' -print -quit)
          mac_sig=$(find dist-macos -name '*.app.tar.gz.sig' -print -quit)
          for f in "$mac_art" "$mac_sig"; do
            if [ -z "$f" ] || [ ! -s "$f" ]; then echo "::error::missing/empty updater artifact or signature: '$f'"; exit 1; fi
          done
          base="https://github.com/$REPO/releases/download/$TAG"
          version="${GITHUB_REF_NAME#v}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n --arg version "$version" --arg pub_date "$pub_date" \
                --arg msig "$(cat "$mac_sig")" --arg murl "$base/$(basename "$mac_art")" \
            '{version: $version, pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {signature: $msig, url: $murl}
              }}' > latest.json
          echo "wrote latest.json for $version (darwin-aarch64)"

      - name: Publish draft release (installer + updater artifacts + latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ needs.build-macos.outputs.signed }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            notes="Signed + notarized macOS (aarch64) build. Auto-update artifacts (latest.json) attached. macOS-only since v0.1.1 (trmx-187). (Alpha — see CHANGELOG.md.)"
          else
            notes="UNSIGNED macOS (aarch64) personal-alpha build (trmx-49) — Gatekeeper will block it: approve under System Settings → Privacy & Security → \"Open Anyway\", or run \`xattr -d com.apple.quarantine /Applications/Termixion.app\`. Auto-updates are signature-verified by the updater key (latest.json attached). macOS-only since v0.1.1 (trmx-187). (Alpha — see CHANGELOG.md.)"
          fi
          gh release create "$TAG" \
            dist-macos/*.dmg dist-macos/*.app.tar.gz dist-macos/*.app.tar.gz.sig \
            latest.json \
            --draft \
            --title "Termixion $TAG" \
            --notes "$notes"
